name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ffmpeg \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config m4 \
            libssl-dev libbz2-dev libreadline-dev libsqlite3-dev \
            libncurses5-dev libncursesw5-dev xz-utils tk-dev liblzma-dev

       - name: Install buildozer and cython
        run: python3.11 -m pip install --upgrade buildozer "Cython==0.29.33"

      - name: Build with Buildozer
        run: python3.11 -m buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stocktreemap-apk
          path: bin/*.apk
